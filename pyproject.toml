[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-noise-research"
version = "0.1.0"
description = "小规模量子噪声演化、测量统计与可复现实验批次"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["quantum_noise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
